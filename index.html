<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTRU Competency Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   ตัวแปรสี — ค่าเริ่มต้นคือธีม "หมึกน้ำเงิน"
   ธีมอื่นเปลี่ยนค่าเหล่านี้ผ่าน JavaScript
   ========================================================== */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8F9FC;
  --text:#14213A; --text-soft:#33456B; --muted:#6B7896;
  --line:#DDE2EC; --line-soft:#EDF0F5;
  --accent:#A67A32; --accent-soft:#F3EADA; --accent-fg:#6E4E1A;
  --sidebar-bg:#14213A; --sidebar-fg:#FFFFFF;
  --btn-bg:#14213A; --btn-fg:#FFFFFF;
  --ok:#256B5A; --ok-bg:#EEF5F2; --ok-line:#BFDBD1;
  --warn:#9A5B18; --warn-bg:#FBF3E9; --warn-line:#E7D2B4;
  --risk:#A03434; --risk-bg:#FBF0F0; --risk-line:#E8C9C9;
  --l1:#F2545B; --l2:#FF8A3D; --l3:#FFC531; --l4:#3FC46A; --l5:#12A150;
  --l4-fg:#FFFFFF; --l5-fg:#FFFFFF;
  /* ชุดสีสำหรับชุดข้อมูลในกราฟ เลือกให้สดและแยกจากกันได้ชัด */
  --c1:#2F6BFF; --c2:#FF7A1A; --c3:#12B886; --c4:#E8368F; --c5:#8B5CF6; --c6:#00B8D9;
  --c1-soft:#D8E4FF;
  --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  font-size:calc(15px * var(--scale)); line-height:1.6;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3{font-family:'Noto Serif Thai',serif;font-weight:600;margin:0;line-height:1.35}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--text-soft)}

/* ---------- หน้าจอยืนยันตัวตน ---------- */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.auth-art{background:var(--sidebar-bg);color:var(--sidebar-fg);padding:3.2rem 3rem;display:flex;flex-direction:column;justify-content:space-between}
.auth-mark{display:flex;gap:.95rem;align-items:center}
.auth-mark img{height:92px;width:auto;display:block;flex:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.28))}
.auth-mark .tx{min-width:0;display:block}
.auth-mark .fac-th{display:block;font-family:'Noto Serif Thai',serif;font-size:1.12rem;font-weight:600;
  letter-spacing:.005em;color:#F3DDAE;line-height:1.3}
.auth-mark .fac-en{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:.665rem;font-weight:600;
  letter-spacing:.085em;opacity:.82;margin-top:.16rem;color:#E8CFA0}
.auth-mark .sysname{display:block;font-family:'Noto Serif Thai',serif;font-size:.92rem;font-weight:500;
  margin-top:.5rem;padding-top:.42rem;border-top:1px solid rgba(243,221,174,.32);opacity:.95}
.auth-mark .sysdesc{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:.76rem;
  font-weight:300;opacity:.62;margin-top:.1rem}
.auth-lede{max-width:28ch}
.auth-lede h1{font-size:2rem;color:var(--sidebar-fg)}
.auth-lede p{margin-top:.9rem;opacity:.7;font-weight:300;font-size:.95rem}
.ladder-art{margin-top:2.1rem;border-left:1px solid rgba(127,127,127,.35);padding-left:1.1rem;list-style:none;padding-top:0;margin-bottom:0}
.ladder-art li{display:flex;align-items:baseline;gap:.8rem;padding:.26rem 0}
.ladder-art .bar{height:6px;border-radius:1px;background:currentColor;display:block}
.ladder-art .lb{font-size:.82rem;opacity:.78;font-weight:300;white-space:nowrap}
.auth-foot{font-size:.74rem;opacity:.45;font-weight:300}
.auth-panel{background:var(--surface);padding:3.2rem 3rem;display:flex;flex-direction:column;justify-content:center}
.auth-form{width:100%;max-width:390px;margin:0 auto}
.auth-form h2{font-size:1.45rem}
.auth-sub{color:var(--muted);font-size:.88rem;margin-top:.4rem}

/* ---------- ฟอร์ม ---------- */
.field{margin-top:1rem}
.field label{display:block;font-size:.82rem;font-weight:500;margin-bottom:.3rem}
.inp{width:100%;padding:.5rem .65rem;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--text);font-size:.88rem}
.inp:focus{border-color:var(--text-soft)}
.inp:disabled{background:var(--line-soft);color:var(--muted)}
.inp-xs{width:74px;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:.75rem;color:var(--muted);margin-top:.26rem}
.chk{display:flex;gap:.5rem;align-items:flex-start;font-size:.82rem;margin-top:1rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem .95rem;border-radius:3px;border:1px solid transparent;font-weight:500;background:transparent}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg);width:100%;margin-top:1.2rem}
.btn-primary:hover{filter:brightness(1.15)}
.btn-ghost{border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--text-soft)}
.btn-danger{border-color:var(--risk-line);color:var(--risk)}
.btn-danger:hover{background:var(--risk-bg)}
.btn-sm{padding:.28rem .6rem;font-size:.82rem;width:auto;margin-top:0}
.linkrow{margin-top:1rem;display:flex;justify-content:space-between;gap:1rem;font-size:.83rem;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--text-soft);text-decoration:underline;text-underline-offset:3px;padding:0}

.alert{margin-top:1rem;padding:.6rem .75rem;border-radius:3px;font-size:.84rem;border-left:3px solid}
.alert-err{background:var(--risk-bg);border-color:var(--risk);color:var(--risk)}
.alert-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.alert-info{background:var(--surface-2);border-color:var(--text-soft);color:var(--text-soft)}
.notebox{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--text-soft);border-radius:3px;padding:.7rem .9rem;font-size:.8rem;color:var(--text-soft)}

.reg2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.8rem}
.reg2 .btn{width:100%}
.demo{margin-top:1.5rem;border-top:1px solid var(--line-soft);padding-top:1rem}
.demo h3{font-size:.84rem;font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600}
.demo p{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.6rem}
.demo-grid button{text-align:left;padding:.36rem .5rem;border:1px solid var(--line);background:var(--surface);border-radius:3px;font-size:.76rem;line-height:1.3}
.demo-grid button:hover{background:var(--line-soft)}
.demo-grid button b{display:block;font-weight:600}
.demo-grid button span{color:var(--muted);font-size:.71rem}

/* ---------- โครงแอป ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--sidebar-bg);color:var(--sidebar-fg);padding:1.3rem 0;display:flex;flex-direction:column}
.side-mark{padding:0 1.2rem 1.1rem;font-family:'Noto Serif Thai',serif;font-size:.98rem;border-bottom:1px solid rgba(127,127,127,.3);display:flex;gap:.6rem;align-items:center}
.side-mark img{height:46px;width:auto;display:block;flex:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
.side-mark .tx{min-width:0}
.side-mark span{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:.7rem;font-weight:300;opacity:.55;margin-top:.1rem}
.side nav{padding:.8rem .55rem;flex:1}
.side nav button{display:block;width:100%;text-align:left;padding:.42rem .66rem;border:none;background:none;color:inherit;opacity:.72;border-radius:3px;font-size:.87rem}
.side nav button:hover{background:rgba(127,127,127,.18);opacity:1}
.side nav button.on{background:rgba(127,127,127,.28);opacity:1;font-weight:500}
.side-user{padding:.85rem 1.2rem 0;border-top:1px solid rgba(127,127,127,.3);font-size:.78rem}
.side-user b{display:block;font-weight:500}
.side-user span{opacity:.55}
.side-user button{margin-top:.55rem;background:none;border:1px solid rgba(127,127,127,.5);color:inherit;padding:.26rem .6rem;border-radius:3px;font-size:.78rem;opacity:.85}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:.8rem 1.8rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.crumb{font-size:.78rem;color:var(--muted)}
.topbar h1{font-size:1.2rem}
.topright{display:flex;align-items:center;gap:.6rem;font-size:.82rem;flex-wrap:wrap}
.content{padding:1.4rem 1.8rem 3rem;min-width:0}

/* ---------- ส่วนประกอบ ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.card-h{padding:.8rem 1.05rem;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.card-h p{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.card-b{padding:1.05rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.85rem 1.05rem}
.stat .k{font-size:.78rem;color:var(--muted)}
.stat .v{font-family:'Noto Serif Thai',serif;font-size:1.7rem;font-weight:600;line-height:1.2;margin-top:.1rem}
.stat .d{font-size:.75rem;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-weight:600;font-size:.78rem;color:var(--muted);padding:.52rem 1.05rem;border-bottom:1px solid var(--line)}
td{padding:.5rem 1.05rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tight th,.tight td{padding:.34rem .5rem}
.sub{font-size:.73rem;color:var(--muted)}
.scroll-x{overflow-x:auto}
.scroll-y{max-height:520px;overflow-y:auto}

.tag{display:inline-block;padding:.06rem .42rem;border-radius:2px;font-size:.74rem;font-weight:500;border:1px solid;white-space:nowrap}
.tag-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.tag-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tag-risk{background:var(--risk-bg);border-color:var(--risk-line);color:var(--risk)}
.tag-n{background:var(--line-soft);border-color:var(--line);color:var(--text-soft)}
.tag-a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}

.tabs{display:flex;gap:.1rem;border-bottom:1px solid var(--line);margin-bottom:1.1rem;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:.48rem .8rem;font-size:.87rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);font-weight:500;border-bottom-color:var(--text)}

.pills{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.pills button{padding:.3rem .75rem;border:1px solid var(--line);background:var(--surface);border-radius:3px;font-size:.83rem;color:var(--text-soft)}
.pills button:hover{border-color:var(--text-soft)}
.pills button.on{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);font-weight:500}
.bar-strip{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.55rem .75rem}
.bar-strip .lb{font-size:.8rem;color:var(--muted);margin-right:.2rem}
.bar-strip .far{margin-left:auto;font-size:.8rem;color:var(--muted)}

.lvl{display:inline-flex;align-items:center;gap:.4rem}
.lvl .dots{display:flex;gap:2px}
.lvl .dots i{width:13px;height:5px;border-radius:1px;display:block}
.lvl .nm{font-size:.79rem;color:var(--text-soft)}
.meter{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;border-radius:4px}

.hbar{display:grid;grid-template-columns:1fr 46px;gap:.5rem;align-items:center;padding:.22rem 0}
.hbar .lbl{font-size:.8rem}
.hbar .track{height:16px;background:var(--line-soft);border-radius:2px;position:relative;overflow:hidden;margin-top:.12rem}
.hbar .fill{height:100%;border-radius:2px}
.hbar .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.hbar .val{font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}

.stepper{display:flex;margin-bottom:1.2rem}
.stepper div{flex:1;padding:.42rem 0 .48rem;border-top:3px solid var(--line);font-size:.78rem;color:var(--muted)}
.stepper div.on{border-color:var(--text);color:var(--text);font-weight:500}

.scale-grid{display:grid;gap:.3rem}
.scale-grid button{padding:.48rem .32rem;border:1px solid var(--line);background:var(--surface);border-radius:3px;text-align:center;font-size:.74rem;line-height:1.35;color:var(--muted)}
.scale-grid button:hover{border-color:var(--text-soft)}
.scale-grid button.on{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.scale-grid button b{display:block;font-family:'Noto Serif Thai',serif;font-size:1.05rem}

.picklist{max-height:540px;overflow-y:auto}
.picklist button{display:block;width:100%;text-align:left;padding:.42rem .68rem;border:none;border-left:3px solid transparent;background:none;font-size:.84rem;line-height:1.4}
.picklist button:hover{background:var(--line-soft)}
.picklist button.on{background:var(--line-soft);border-left-color:var(--text);font-weight:500}
.picklist button.off{opacity:.45}
.picklist small{display:block;color:var(--muted);font-size:.73rem;font-weight:400}

.qcell{text-align:center;cursor:pointer;user-select:none}
.qcell.on{background:var(--l4);color:var(--l4-fg);font-weight:600}
.editrow{display:flex;gap:.45rem;align-items:center;padding:.34rem 0;border-bottom:1px solid var(--line-soft)}
.editrow:last-child{border-bottom:none}
.empty{text-align:center;padding:2.1rem 1rem;color:var(--muted);font-size:.88rem}
.evidence{border:1px solid var(--line);border-radius:4px;padding:.75rem .9rem;background:var(--surface)}
.aibox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:.8rem .95rem;color:var(--accent-fg)}
.aibox .lb{font-size:.76rem;font-weight:600}
.aibox p{font-size:.84rem;margin-top:.3rem}
.aibox .note{font-size:.72rem;opacity:.8;margin-top:.45rem}

/* ---------- แผงตั้งค่าธีม ---------- */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:50}
.drawer-panel{width:min(400px,100%);background:var(--surface);height:100%;overflow-y:auto;padding:1.3rem 1.4rem;border-left:1px solid var(--line)}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.5rem}
.tcard{border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;background:var(--surface);
  box-shadow:0 2px 10px rgba(0,0,0,.05);margin-top:1.6rem}
.tsec{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.93rem;color:var(--text)}
.tsec svg{color:var(--c1-ink,var(--c1));flex:none}
.tdots{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.75rem}
.tdot{width:36px;height:36px;border-radius:50%;border:none;padding:0;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tdot:hover{transform:scale(1.06)}
.tdot.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c1)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;margin-top:.7rem;
  border:1px solid var(--line);border-radius:12px;padding:.35rem}
.seg button{padding:.6rem .2rem;background:none;border:2px solid transparent;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;gap:.3rem;font-size:.82rem;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{border-color:var(--c1);color:var(--c1-ink,var(--c1));font-weight:600}
.huegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.5rem}
.huegrid .swatch{padding:.45rem .5rem}
.huegrid .dots i{width:13px;height:20px;border-radius:2px}
.swatch.wide{display:block}
.modebtn{border:1px solid var(--line);border-radius:4px;padding:.55rem .6rem;background:var(--surface);text-align:left}
.modebtn.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset}
.modebtn .nm{display:block;font-size:.86rem;font-weight:500;margin-top:.35rem}
.modebtn .ds{display:block;font-size:.72rem;color:var(--muted)}
.mprev{display:flex;height:26px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.mprev i{flex:2;display:block}.mprev b{flex:1;display:block}
.mprev.light i{background:#FFFFFF}.mprev.light b{background:#1B2A44}
.mprev.dark i{background:#12171F}.mprev.dark b{background:#5B9BFF}
.swatch{border:1px solid var(--line);border-radius:4px;padding:.55rem .6rem;background:var(--surface);text-align:left}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset}
.swatch .dots{display:flex;gap:3px;margin-bottom:.35rem}
.swatch .dots i{width:16px;height:16px;border-radius:3px;display:block;border:1px solid rgba(127,127,127,.35)}
.swatch .nm{font-size:.83rem;font-weight:500}
.swatch .ds{font-size:.72rem;color:var(--muted)}

svg.chart{display:block;width:100%;height:auto}
.themebtns{display:flex;gap:.25rem}
.tbtn{display:flex;padding:2px;border:1px solid var(--line);border-radius:3px;background:var(--surface);gap:0}
.tbtn i{width:9px;height:15px;display:block}
.tbtn:hover{border-color:var(--text-soft)}
.tbtn.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset}
.ladderbar{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem}
.lstep{border:1px solid var(--line);border-radius:4px;padding:.6rem .65rem;opacity:.5;background:var(--surface)}
.lstep.on{opacity:1}
.lstep.at{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset;opacity:1}
.lstep .lnum{font-size:.72rem;color:var(--muted)}
.lstep .lname{font-family:'Noto Serif Thai',serif;font-weight:600;font-size:.92rem;line-height:1.3}
.lstep .len{font-size:.73rem;color:var(--muted)}
.lstep .lfill{height:6px;border-radius:2px;margin-top:.5rem}
.lstep .lyou{margin-top:.35rem;font-size:.72rem;color:var(--accent);font-weight:600}
.stackbar{display:flex;height:18px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.stackbar div{font-size:.7rem;text-align:center;line-height:18px}
.delta{font-variant-numeric:tabular-nums;font-size:.8rem}
.pfhead{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1rem 1.1rem;
  display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar.hasimg{background:none;padding:0;overflow:hidden;border:2px solid var(--line)}
.avbig{width:132px;height:132px;border-radius:50%;overflow:hidden;border:2px solid var(--line);
  background:var(--c1);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif Thai',serif;font-size:3rem;flex:none}
.avbig img{width:100%;height:100%;object-fit:cover;display:block}
.avrow{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--l4);color:var(--l4-fg,#fff);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Thai',serif;font-size:1.5rem;font-weight:600}
.pfmeta{min-width:0;flex:1}
.pfname{font-family:'Noto Serif Thai',serif;font-size:1.15rem;font-weight:600;line-height:1.3}
.pfrole{display:flex;gap:.3rem;flex-wrap:wrap;margin:.25rem 0}
.pfsub{font-size:.79rem;color:var(--muted)}
.pfnav{display:flex;gap:.35rem;flex-wrap:wrap}
.stepnum{width:24px;height:24px;border-radius:50%;background:var(--line-soft);color:var(--text-soft);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;margin-top:.1rem}
.mlist{padding:.4rem 0;max-height:560px;overflow-y:auto}
.mgrp{padding:.5rem .8rem .25rem;font-size:.78rem;font-weight:600;color:var(--muted)}
.mitem{display:block;width:100%;text-align:left;padding:.4rem .8rem .4rem 1.4rem;border:none;
  border-left:3px solid transparent;background:none;font-size:.85rem;line-height:1.4}
.mitem:hover{background:var(--line-soft)}
.mitem.on{background:var(--btn-bg);color:var(--btn-fg);border-left-color:var(--c1);font-weight:500}
.cmtable{width:auto}
.cmtable th{font-size:.79rem;padding:.4rem .6rem}
.cmcell{text-align:center;padding:.7rem 1.1rem;border:1px solid var(--line)}
.cmcell.ok{background:var(--ok-bg)} .cmcell.warn{background:var(--warn-bg)} .cmcell.bad{background:var(--risk-bg)}
.cmv{font-family:'Noto Serif Thai',serif;font-size:1.5rem;font-weight:600;line-height:1.1}
.cml{font-size:.73rem;color:var(--muted);margin-top:.15rem}
.prm{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:600}
.prm span{font-weight:400;color:var(--muted);font-size:.73rem}
.prmout{font-size:.76rem;margin-left:auto}
.itemcard{border:1px solid var(--line);border-radius:5px;padding:.8rem .9rem;margin-bottom:.8rem;background:var(--surface-2)}
.itemhead{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.opts{margin-top:.5rem;display:flex;flex-direction:column;gap:.32rem}
.optrow{display:flex;align-items:center;gap:.5rem}
.optrow.iskey .inp{border-color:var(--ok)}
.optlb{width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--surface);
  font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.optlb:hover{border-color:var(--text-soft)}
.optlb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pwmeter{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-top:.35rem}
.pwmeter i{display:block;height:100%;border-radius:3px;background:var(--risk);transition:width .15s}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:.5rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.3rem;vertical-align:-1px}

@media (max-width:1040px){
  .auth{grid-template-columns:1fr}
  .auth-art,.auth-panel{padding:1.8rem 1.3rem}
  .auth-mark img{height:74px}
  .auth-mark .fac-th{font-size:1rem}
  .auth-mark .fac-en{font-size:.6rem;letter-spacing:.06em}
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:.45rem;align-items:center}
  .side-mark,.side-user{display:none}
  .side nav{display:flex;gap:.25rem;padding:0}
  .side nav button{white-space:nowrap}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .ladderbar{grid-template-columns:1fr}
  .content,.topbar{padding-left:.9rem;padding-right:.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- 1. คณิตศาสตร์พื้นฐาน ---------- */
const sig = x => 1/(1+Math.exp(-Math.max(-40,Math.min(40,x))));
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sdev = a => { const m=mean(a); return Math.sqrt(mean(a.map(v=>(v-m)**2))); };
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const fmt = (v,d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const lcg = s => { let x=s>>>0; return ()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let UID = 0; const nid = p => p + (++UID);

function erf(x){
  const s=Math.sign(x); x=Math.abs(x);
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const t=1/(1+p*x);
  return s*(1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));
}
function probit(p){
  p=clamp(p,1e-6,1-1e-6);
  const a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.38357751867269e2,-3.066479806614716e1,2.506628277459239];
  const b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  const c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996,3.754408661907416];
  const pl=.02425; let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

/* ---------- 2. Graded Response Model ---------- */
const NODES = Array.from({length:61},(_,i)=>-4+i*(8/60));
const PRIOR = NODES.map(t=>Math.exp(-t*t/2));

function grmProbs(theta,a,b){
  const cum=[1,...b.map(bk=>sig(a*(theta-bk))),0], p=[];
  for(let k=0;k<b.length+1;k++) p.push(Math.max(1e-10,cum[k]-cum[k+1]));
  return p;
}
function grmEAP(items){
  if(!items.length) return null;
  const post=NODES.map((t,i)=>{ let L=PRIOR[i]; for(const it of items) L*=grmProbs(t,it.a,it.b)[it.x]; return L; });
  const s=post.reduce((x,y)=>x+y,0);
  if(!(s>0)) return null;
  const th=NODES.reduce((acc,t,i)=>acc+t*post[i],0)/s;
  const v=NODES.reduce((acc,t,i)=>acc+(t-th)**2*post[i],0)/s;
  return {theta:th, se:Math.sqrt(v), rel:1-v};
}
/** สอบเทียบเบื้องต้นด้วยวิธี normal-ogive (Thurstone) */
function calibrateGRM(col,totals,K){
  const b=[], n=col.length;
  for(let k=1;k<K;k++) b.push(clamp(probit(1-col.filter(x=>x>=k).length/n),-3,3));
  for(let k=1;k<b.length;k++) if(b[k]<=b[k-1]) b[k]=b[k-1]+.12;
  const mx=mean(col), mt=mean(totals), sx=sdev(col)||1, st=sdev(totals)||1;
  const cov=mean(col.map((v,i)=>(v-mx)*(totals[i]-mt)));
  const r=clamp(cov/(sx*st),.05,.95);
  return {a:+clamp((r/Math.sqrt(1-r*r))*1.7,.4,3).toFixed(2), b:b.map(v=>+v.toFixed(2))};
}

/* ---------- 3. G-DINA รูปแบบ additive ---------- */
function gdinaP(it,alpha){
  if(!it.qi.length) return .5;
  let m=0; for(const k of it.qi) if(alpha[k]===1) m++;
  return it.g + (1-it.s-it.g)*(m/it.qi.length);
}
function gdinaPosterior(items,K){
  if(!items.length||K<1||K>20) return null;
  const N=1<<K, post=new Float64Array(N), alpha=new Int8Array(K);
  let sum=0, bi=0;
  for(let p=0;p<N;p++){
    for(let k=0;k<K;k++) alpha[k]=(p>>k)&1;
    let L=1;
    for(const it of items){ const pr=gdinaP(it,alpha); L*= it.y?pr:(1-pr); }
    post[p]=L; sum+=L; if(L>post[bi]) bi=p;
  }
  if(!(sum>0)) return null;
  const marg=new Array(K).fill(0);
  for(let p=0;p<N;p++){
    const w=post[p]/sum; if(w<1e-12) continue;
    for(let k=0;k<K;k++) if((p>>k)&1) marg[k]+=w;
  }
  return {marginal:marg, profile:Array.from({length:K},(_,k)=>(bi>>k)&1), pProfile:post[bi]/sum, N};
}

/* ---------- 4. EDM ทำนายความเสี่ยง ---------- */
const EDM_TERMS=[
  {key:"theta",       label:"ค่าสมรรถนะรวม (θ)",                 w:-1.30},
  {key:"minTheta",    label:"สมรรถนะด้านที่อ่อนที่สุด",           w:-0.75},
  {key:"evidence",    label:"ความครบถ้วนของหลักฐาน",              w:-1.25},
  {key:"ontime",      label:"การส่งงานตรงเวลา",                   w:-1.10},
  {key:"belowTarget", label:"สัดส่วนสมรรถนะที่ต่ำกว่าเป้าหมาย",   w: 1.60},
];
function edmPredict(x){
  const parts=EDM_TERMS.map(t=>({...t,x:x[t.key],c:t.w*x[t.key]}));
  const z=0.30+parts.reduce((a,p)=>a+p.c,0);
  return {risk:sig(z), z, parts};
}

function makeIndicator(text,nComp,ci,levelCount,rng){
  const j=(rng()-.5)*.5;
  return {id:nid("I"), th:text,
    descriptors:DEFAULT_DESC.slice(0,levelCount),
    irt:{a:+(1.15+j).toFixed(2), b:[-1.60,-.60,.45,1.45].slice(0,levelCount-1).map(v=>+(v+j*.6).toFixed(2))},
    cdm:{g:+(.14+rng()*.08).toFixed(2), s:+(.10+rng()*.08).toFixed(2)},
    q:Array.from({length:nComp},(_,k)=>(k===ci?1:0))};
}
function buildFramework(){
  const rng=lcg(20690903);
  const levels=DEFAULT_LEVELS.map(l=>({...l}));
  const competencies=MASTER.map(([th,en,ptru],i)=>({
    id:"C"+String(i+1).padStart(2,"0"), code:"PC-"+String(i+1).padStart(2,"0"), th, en, ptru}));
  const years=YEAR_STAGES.map(ys=>({
    year:ys.year, label:ys.label, stage:ys.stage,
    config:Object.fromEntries(competencies.map((c,ci)=>[c.id,{
      active:true, target:ys.target, test:{open:true,n:ITEMS_PER_COMP_DEF,min:45},
      indicators:ys.tpl.map(t=>makeIndicator(t.replace(/%C%/g,c.th),competencies.length,ci,levels.length,rng))}]))
  }));
  return {levels,competencies,years};
}
const ITEMS_PER_COMP_DEF=30;
let FW = buildFramework();

const yearOf = (fw,y) => fw.years.find(x=>x.year===y) || fw.years[0];
const cfgOf  = (fw,y,cid) => yearOf(fw,y).config[cid] || {active:false,target:3,indicators:[]};
const activeComps = (fw,y) => fw.competencies.filter(c=>cfgOf(fw,y,c.id).active);
const indsOf = (fw,y,cid) => cfgOf(fw,y,cid).indicators;
const allInds = (fw,y) => activeComps(fw,y).flatMap(c=>indsOf(fw,y,c.id).map(i=>({...i,comp:c})));

  if(["Administrator","Dean"].includes(S.role)) return null;
  return S.user.program||null;
}

  if(p.length>=12) k++; if(p.length>=16) k++;
  if(/[a-z]/.test(p)&&/[A-Z]/.test(p)) k++;
  if(/[0-9]/.test(p)) k++;
  if(/[^A-Za-z0-9]/.test(p)) k++;
  return clamp(k,0,5);
}

function seedResponsesFor(u){
  if(!u.roles.includes("Student")||u.linkTo||u.ability===undefined) return;
  const seed=parseInt(u.id.replace(/\D/g,""),10)||1;
  const grng=lcg(900+seed*7); grng(); grng(); grng();   // ทิ้งค่าแรกเพื่อตัดความสัมพันธ์ระหว่างเมล็ดที่ใกล้กัน
  const growth=-0.14+grng()*0.60;                // อัตราพัฒนาการต่อรอบ บางคนคงที่หรือถดถอย
  const yc=yearOf(FW,u.year);
  const rounds=ROUNDS.map((r,ri)=>{
    /* ผู้ประเมินสองฝ่ายให้คะแนนแยกกัน โดยมีความเห็นต่างกันเล็กน้อยตามธรรมชาติ */
    const rngL=lcg(7000+seed*91+ri*137);          // อาจารย์นิเทศก์
    const rngM=lcg(9100+seed*67+ri*211);          // ครูพี่เลี้ยง
    const ab=u.ability-(ROUNDS.length-1-ri)*growth;
    const lec={}, men={}, m={};
    FW.competencies.forEach((c,ci)=>{
      const org=lcg(500+ci*13); org(); org(); org();
      const off=(org()-.5)*1.2;
      (yc.config[c.id].indicators||[]).forEach(ind=>{
        const l=clamp(Math.round(ab+off+(rngL()-.5)*1.0),1,5);
        const mm=clamp(Math.round(ab+off+0.12+(rngM()-.5)*1.1),1,5);   // ครูพี่เลี้ยงให้คะแนนสูงกว่าเล็กน้อย
        lec[ind.id]=l; men[ind.id]=mm;
        m[ind.id]=clamp(Math.round((l+mm)/2),1,5);   // ค่าที่ใช้ในการวิเคราะห์ทางจิตมิติ ต้องเป็นจำนวนเต็ม
      });
    });
    return {label:r.label,when:r.when,resp:m,lec,men};
  });
  HIST[u.id]=rounds;
  RESP[u.id]=rounds[rounds.length-1].resp;   // รอบล่าสุดคือผลปัจจุบัน
  RESP_L[u.id]=rounds[rounds.length-1].lec;
  RESP_M[u.id]=rounds[rounds.length-1].men;
}

/** คะแนนรายสมรรถนะจากผู้ประเมินฝ่ายใดฝ่ายหนึ่ง  src = "lec" หรือ "men" */
function compScoreBy(fw,sid,comp,year,src,resp){
  const r=resp||(src==="lec"?RESP_L[sid]:RESP_M[sid])||{};
  const v=indsOf(fw,year,comp.id).map(i=>r[i.id]).filter(x=>x!==undefined);
  return v.length?mean(v):null;
}
/** คะแนนที่ใช้รายงานแก่นักศึกษา = (คะแนนอาจารย์ + คะแนนครูพี่เลี้ยง) หารสอง
    หากมีผู้ประเมินฝ่ายเดียว จะใช้ค่าของฝ่ายนั้นและระบุกำกับไว้ */
function compScoreAvg(fw,sid,comp,year,round){
  const rl=round?round.lec:RESP_L[sid], rm=round?round.men:RESP_M[sid];
  const l=compScoreBy(fw,sid,comp,year,"lec",rl);
  const m=compScoreBy(fw,sid,comp,year,"men",rm);
  if(l===null&&m===null) return {v:null,l:null,m:null,n:0};
  if(l===null) return {v:m,l:null,m:m,n:1};
  if(m===null) return {v:l,l:l,m:null,n:1};
  return {v:(l+m)/2,l,m,n:2};
}
function overallAvg(fw,sid,year,round){
  const v=activeComps(fw,year).map(c=>compScoreAvg(fw,sid,c,year,round).v).filter(x=>x!==null);
  return v.length?mean(v):null;
}
/** คะแนนรายสมรรถนะที่ใช้แสดงและรายงานทุกหน้า
    = (คะแนนอาจารย์นิเทศก์ + คะแนนครูพี่เลี้ยง) หารด้วย 2
    หมายเหตุ: การวิเคราะห์ทางจิตมิติ (IRT, MIRT, G-DINA) และแบบจำลอง EDM
    ใช้ค่าที่ปัดเป็นจำนวนเต็มจาก RESP เพราะโมเดลต้องการหมวดคะแนนแบบไม่ต่อเนื่อง */
function compScore(fw,sid,comp,year){
  if(RESP_L[sid]&&RESP_M[sid]) return compScoreAvg(fw,sid,comp,year).v;
  const r=RESP[sid]||{};
  const v=indsOf(fw,year,comp.id).map(i=>r[i.id]).filter(x=>x!==undefined);
  return v.length?mean(v):null;
}
function overallScore(fw,sid,year){
  const v=activeComps(fw,year).map(c=>compScore(fw,sid,c,year)).filter(x=>x!==null);
  return v.length?mean(v):null;
}
const levelOf=(fw,v)=> (v===null||v===undefined)?null:fw.levels[clamp(Math.round(v)-1,0,fw.levels.length-1)];

function analyze(fw,sid,opts){
  opts=opts||{};
  const st=userById(sid); if(!st) return null;
  const y=st.year, r=RESP[sid]||{}, comps=activeComps(fw,y);
  const idx=new Map(comps.map((c,k)=>[c.id,k]));
  const flat=[];
  comps.forEach(c=>{
    const tg=cfgOf(fw,y,c.id).target;
    indsOf(fw,y,c.id).forEach(i=>{ if(r[i.id]!==undefined) flat.push({ind:i,comp:c,x:r[i.id]-1,raw:r[i.id],target:tg}); });
  });
  const irt=grmEAP(flat.map(f=>({a:f.ind.irt.a,b:f.ind.irt.b,x:f.x})));
  const mirt=comps.map(c=>{
    const its=indsOf(fw,y,c.id).filter(i=>r[i.id]!==undefined);
    return {comp:c,n:its.length,target:cfgOf(fw,y,c.id).target,
      est:grmEAP(its.map(i=>({a:i.irt.a,b:i.irt.b,x:r[i.id]-1}))), raw:compScore(fw,sid,c,y)};
  });
  let gdina=null;
  if(opts.cdm){
    const items=flat.map(f=>({
      qi:f.ind.q.map((v,k)=>v?fw.competencies[k]:null).map(c=>(c&&idx.has(c.id))?idx.get(c.id):-1).filter(k=>k>=0),
      g:f.ind.cdm.g,s:f.ind.cdm.s,y:f.raw>=f.target?1:0}));
    gdina=gdinaPosterior(items,comps.length);
  }
  const thetas=mirt.map(m=>m.est&&m.est.theta).filter(v=>v!==null&&v!==undefined);
  const withRaw=mirt.filter(m=>m.raw!==null);
  const belowTarget=withRaw.length?withRaw.filter(m=>m.raw<m.target).length/withRaw.length:0;
  const edm=edmPredict({theta:irt?irt.theta:0,minTheta:thetas.length?Math.min(...thetas):0,
    evidence:st.evidence||0,ontime:st.ontime||0,belowTarget});
  return {irt,mirt,gdina,edm,nItems:flat.length,year:y,comps,belowTarget};
}

const hsl=(h,s,l)=>`hsl(${((h%360)+360)%360}, ${s}%, ${l}%)`;

/* ---------- เครื่องมือคำนวณสีให้สดที่สุดเท่าที่ยังอ่านออก ---------- */
function hsl2rgbArr(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return [r,g,b].map(v=>Math.round((v+m)*255));
}
const relLum=c=>{const a=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];};
const cRatio=(a,b)=>{const L1=relLum(a),L2=relLum(b);return (Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05);};
/** เริ่มจากสีบริสุทธิ์ที่ความสว่าง 50 ซึ่งเป็นจุดสดที่สุดของเฉดนั้น
    แล้วขยับความสว่างให้น้อยที่สุดเท่าที่จำเป็นจนผ่านเกณฑ์คอนทราสต์ตามเป้า */
function vividL(h,bg,target,dir){
  for(let l=50; l>=4 && l<=96; l+=dir){
    if(cRatio(hsl2rgbArr(h,100,l),bg)>=target) return l;
  }
  return dir<0?10:92;
}
const vivid=(h,bg,target,dir)=>hsl(h,100,vividL(h,bg,target,dir));

function radarSVG(items,max){

function densitySVG(t,se){
  const W=460,H=210,pad=34;
  const xs=NODES.filter((_,i)=>i%1===0);
  const ys=xs.map(x=>Math.exp(-((x-t)**2)/(2*se*se)));

  const X=x=>pad+((x+4)/8)*(W-pad-12);
  const Y=y=>H-24-(y/mx)*(H-46);
  const d=xs.map((x,i)=>`${i?"L":"M"}${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
  let ticks="";
  [-3,-2,-1,0,1,2,3].forEach(v=>{
    ticks+=`<line x1="${X(v)}" y1="${H-24}" x2="${X(v)}" y2="${H-20}" stroke="var(--muted)"/>
      <text x="${X(v)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${v}</text>`;
  });
  const lo=X(t-1.96*se),hi=X(t+1.96*se);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="การกระจายของค่าความสามารถ">

    <line x1="${pad}" y1="${H-24}" x2="${W-12}" y2="${H-24}" stroke="var(--line)"/>

}

/** เรดาร์หลายชุดข้อมูล ใช้เปรียบเทียบผลหลายรอบบนแกนเดียวกัน */
function radarMultiSVG(labels,series,max,tips){
  const N=labels.length; if(!N) return "";
  const W=460,H=460,cx=W/2,cy=H/2,R=158;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let rings="";
  for(let g=1;g<=max;g++){
    const r=R*g/max;
    const p=Array.from({length:N},(_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ");
    rings+=`<polygon points="${p}" fill="none" stroke="var(--line-soft)" stroke-width="1"/>`;
  }
  let spokes="",lab="";
  labels.forEach((L,i)=>{
    const [x,y]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line-soft)"/>`;
    const [lx,ly]=pt(i,R+15);
    lab+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" fill="var(--muted)"
      text-anchor="${Math.abs(lx-cx)<6?"middle":(lx>cx?"start":"end")}" dominant-baseline="middle">${esc(L)}<title>${esc((tips&&tips[i])||L)}</title></text>`;
  });
  const polys=series.map(sr=>{
    const pts=sr.values.map((v,i)=>pt(i,R*clamp((v||0)/max,0,1)).map(z=>z.toFixed(1)).join(" ").replace(" ",",")).join(" ");
    const dash=sr.dash?` stroke-dasharray="${sr.dash}"`:"";
    return `<polygon points="${pts}" fill="${sr.fill===false?"none":sr.color}" fill-opacity="${sr.fill===false?0:0.16}"
      stroke="${sr.color}" stroke-width="${sr.w||2}"${dash}/>`;
  }).join("");
  const dots=series.filter(sr=>sr.dots!==false).map(sr=>sr.values.map((v,i)=>{
    const [x,y]=pt(i,R*clamp((v||0)/max,0,1));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${sr.color}"><title>${esc(sr.name)} · ${esc((tips&&tips[i])||labels[i])}: ${fmt(v)}</title></circle>`;
  }).join("")).join("");
  const lg=series.map(sr=>`<span><i style="background:${sr.color}"></i>${esc(sr.name)}</span>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="แผนภาพเรดาร์เปรียบเทียบรอบการประเมิน">

/** แผนภูมิแท่งแนวนอนแบบหลายชุด พร้อมขีดแสดงระดับเป้าหมาย */
function groupBarSVG(labels,series,max,targets,tips){
  const N=labels.length, K=series.length;
  const rowH=Math.max(26,10+K*9), padL=182, padR=44, W=640, H=N*rowH+34;
  const X=v=>padL+clamp(v/max,0,1)*(W-padL-padR);
  let grid="";
  for(let g=0;g<=max;g++){
    grid+=`<line x1="${X(g).toFixed(1)}" y1="18" x2="${X(g).toFixed(1)}" y2="${H-8}" stroke="var(--line-soft)"/>
      <text x="${X(g).toFixed(1)}" y="12" font-size="10" fill="var(--muted)" text-anchor="middle">${g}</text>`;
  }
  let body="";
  labels.forEach((L,i)=>{
    const y0=22+i*rowH;
    body+=`<text x="${padL-8}" y="${(y0+rowH/2-2).toFixed(1)}" font-size="10.5" fill="var(--text-soft)"
      text-anchor="end" dominant-baseline="middle">${esc(L)}<title>${esc((tips&&tips[i])||L)}</title></text>`;
    series.forEach((sr,k)=>{
      const v=sr.values[i]; if(v===null||v===undefined) return;
      const h=Math.max(5,(rowH-12)/K);
      const yy=y0+4+k*h;
      body+=`<rect x="${padL}" y="${yy.toFixed(1)}" width="${(X(v)-padL).toFixed(1)}" height="${(h-1.5).toFixed(1)}"
        fill="${sr.color}" rx="1.5"><title>${esc(sr.name)} · ${esc((tips&&tips[i])||L)}: ${fmt(v)}</title></rect>`;
      if(k===K-1) body+=`<text x="${(X(v)+5).toFixed(1)}" y="${(yy+h/2).toFixed(1)}" font-size="10"
        fill="var(--muted)" dominant-baseline="middle">${fmt(v,1)}</text>`;
    });
    if(targets&&targets[i]!==undefined && targets[i]!==null)
      body+=`<line x1="${X(targets[i]).toFixed(1)}" y1="${(y0+2).toFixed(1)}" x2="${X(targets[i]).toFixed(1)}"
        y2="${(y0+rowH-6).toFixed(1)}" stroke="var(--accent)" stroke-width="2.5"><title>ระดับเป้าหมาย ${targets[i]}</title></line>`;
  });
  const lg=series.map(sr=>`<span><i style="background:${sr.color}"></i>${esc(sr.name)}</span>`).join("")
    +(targets?`<span><i style="background:var(--accent)"></i>ระดับเป้าหมายของชั้นปี</span>`:"");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="แผนภูมิแท่งเปรียบเทียบรายสมรรถนะ">
    ${grid}${body}</svg><div class="legend">${lg}</div>`;
}

function divergeBars(parts){
  const m=Math.max(...parts.map(p=>Math.abs(p.c)),.1);
  return parts.map(p=>{
    const w=Math.abs(p.c)/m*46;
    const pos=p.c>0;
    return `<div class="hbar" style="grid-template-columns:1fr 60px">
      <div><div class="lbl">${esc(p.label)}</div>

      </div></div>
      <div class="val">${p.c>0?"+":""}${p.c.toFixed(2)}</div></div>`;

}

  if(st===4) body=`<h2>ตั้งรหัสผ่านและยอมรับเงื่อนไข</h2>

      ${pwMeter("s_p1")}<div class="hint">อย่างน้อย 12 อักขระ</div></div>

    <label class="chk"><input type="checkbox" id="s_c1" data-nore><span>ข้าพเจ้ายอมรับ<b>นโยบายคุ้มครองข้อมูลส่วนบุคคล</b> และยินยอมให้จัดเก็บผลการประเมินและหลักฐานการเรียนรู้ของข้าพเจ้า</span></label>
    <label class="chk"><input type="checkbox" id="s_c2" data-nore><span>ข้าพเจ้ารับทราบว่าอาจารย์นิเทศก์ ครูพี่เลี้ยง และประธานหลักสูตรของสาขาวิชาที่ข้าพเจ้าสังกัด สามารถเข้าถึงผลการประเมินของข้าพเจ้าได้</span></label>
    ${S.err?`<div class="alert alert-err">${esc(S.err)}</div>`:""}

    <div class="linkrow"><button class="linkbtn" data-act="stustep" data-v="3">ย้อนกลับ</button></div>`;

  if(st===5) body=`<h2>ยืนยันอีเมล</h2>

/* ---------- 13. หน้าจัดการผู้ใช้งานและกลุ่ม ---------- */
function usersPage(){
  const f=S.usrFilter;
  const tabs=[["list","รายชื่อผู้ใช้"],["groups","กลุ่มผู้ใช้"],["add","เพิ่มผู้ใช้"]]
    .map(([k,l])=>`<button class="${S.usrTab===k?"on":""}" data-act="usrtab" data-v="${k}">${l}</button>`).join("");
  let body="";
  if(S.usrTab==="list") body=usersList();
  else if(S.usrTab==="groups") body=usersGroups();
  else body=userForm(null);
  const edit=S.usrEdit?userForm(S.usrEdit):"";
  return `<div class="stack">${scopeBanner()}${S.msg?`<div class="notebox">${esc(S.msg)}</div>`:""}
    <div class="tabs">${tabs}</div>${edit||body}</div>`;
}
function filteredUsers(){
  const f=S.usrFilter, pg=scopeProgram();
  return USERS.filter(u=>{
    if(u.linkTo) return false;
    if(pg && u.program!==pg) return false;
    if(f.role!=="all" && !u.roles.includes(f.role)) return false;
    if(f.program!=="all" && u.program!==f.program) return false;
    if(f.year!=="all" && String(u.year)!==f.year) return false;
    if(f.q){const q=f.q.toLowerCase();
      if(!(u.name.toLowerCase().includes(q)||String(u.code).toLowerCase().includes(q)||u.email.toLowerCase().includes(q))) return false;}
    return true;
  });
}
function usersList(){
  const f=S.usrFilter;
  const roleOpts=["all","Student","Lecturer","Program Chair","Mentor","Dean","Administrator"]
    .map(r=>`<option value="${r}" ${f.role===r?"selected":""}>${r==="all"?"ทุกบทบาท":ROLE_TH[r]||r}</option>`).join("");
  const progOpts=`<option value="all">ทุกสาขาวิชา</option>`+PROGRAMS.map(p=>`<option value="${p.id}" ${f.program===p.id?"selected":""}>${p.id} · ${p.th}</option>`).join("");
  const yearOpts=`<option value="all">ทุกชั้นปี</option>`+[1,2,3,4].map(y=>`<option value="${y}" ${f.year===String(y)?"selected":""}>ชั้นปีที่ ${y}</option>`).join("");
  const list=filteredUsers();
  const rows=list.map(u=>`<tr>
    <td>${esc(u.name)}<div class="sub">${esc(u.code)} · ${esc(u.email)}</div></td>
    <td>${u.roles.map(r=>`<span class="tag tag-n">${ROLE_TH[r]||r}</span>`).join(" ")}</td>
    <td>${u.program?`<span class="tag tag-a">${u.program}</span> <span class="sub">${esc(progName(u.program))}</span>`:(u.school?esc(u.school):"—")}</td>
    <td class="num">${u.year?"ปี "+u.year:"—"}</td>
    <td><span class="tag ${u.status==="active"?"tag-ok":"tag-warn"}">${u.status==="active"?"ใช้งานอยู่":"ระงับ"}</span></td>

      <button class="btn btn-ghost btn-sm" data-act="usredit" data-v="${u.id}">แก้ไข</button>
      <button class="btn btn-ghost btn-sm" data-act="usrtoggle" data-v="${u.id}">${u.status==="active"?"ระงับ":"เปิดใช้"}</button>
      <button class="btn btn-danger btn-sm" data-act="usrdel" data-v="${u.id}">ลบ</button></td></tr>`).join("");
  const filters=`<div class="row">
    <select class="inp" style="width:auto" data-act="usrf" data-k="role">${roleOpts}</select>
    <select class="inp" style="width:auto" data-act="usrf" data-k="program">${progOpts}</select>
    <select class="inp" style="width:auto" data-act="usrf" data-k="year">${yearOpts}</select>
    <input class="inp" style="width:200px" placeholder="ค้นหาชื่อ รหัส หรืออีเมล" value="${esc(f.q)}" data-act="usrq" data-nore>
    <button class="btn btn-ghost btn-sm" data-act="usrclear">ล้างตัวกรอง</button></div>`;
  return card("รายชื่อผู้ใช้งาน",`แสดง ${list.length} จาก ${USERS.filter(u=>!u.linkTo).length} บัญชี`,
    `<div class="card-b" style="border-bottom:1px solid var(--line-soft)">${filters}</div>
     <div class="scroll-x">${list.length?`<table><thead><tr><th>ชื่อ</th><th>บทบาท</th><th>สาขาวิชา / สังกัด</th><th class="num">ชั้นปี</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
       :`<div class="empty">ไม่พบผู้ใช้ตามเงื่อนไขที่เลือก</div>`}</div>`,
    `<button class="btn btn-ghost btn-sm" data-act="usrtab" data-v="add">เพิ่มผู้ใช้</button>`,false);
}

  const pg=scopeProgram();
  const staff=[["Lecturer","อาจารย์"],["Program Chair","ประธานหลักสูตร"],["Mentor","ครูพี่เลี้ยง"],["Dean","คณบดี"],["Administrator","ผู้ดูแลระบบ"]]

    ${card("กลุ่มบุคลากร","",`<table class="tight"><thead><tr><th>บทบาท</th><th class="num">จำนวน</th></tr></thead><tbody>${staff}</tbody></table>`,"",false)}

/* ---------- 14. หน้ากรอบสมรรถนะ ---------- */
function yearStrip(y,act,note){
  const btns=FW.years.map(yy=>`<button class="${yy.year===y?"on":""}" data-act="${act}" data-v="${yy.year}">${yy.year}</button>`).join("");
  const yc=yearOf(FW,y);
  return `<div class="bar-strip"><span class="lb">ชั้นปี</span>${btns}
    <span class="far">${note||`${yc.label} · ระยะ${yc.stage} · ${activeComps(FW,y).length} สมรรถนะที่เปิดใช้`}</span></div>`;
}
function frameworkPage(readOnly,roMaster){
  if(roMaster===undefined) roMaster=readOnly;
  const y=S.year, yc=yearOf(FW,y);
  const tabs=[["year","ภาพรวมชั้นปี"],["ind","ตัวชี้วัด"],["rubric","เกณฑ์การประเมิน"],["master","สมรรถนะหลัก"],["levels","ระดับสมรรถนะ"]]
    .map(([k,l])=>`<button class="${S.fwTab===k?"on":""}" data-act="fwtab" data-v="${k}">${l}</button>`).join("");
  let body="";
  if(S.fwTab==="year") body=fwYearTab(y,readOnly);
  else if(S.fwTab==="master") body=fwMasterTab(roMaster);
  else if(S.fwTab==="levels") body=fwLevelsTab(roMaster);
  else body=fwIndTab(y,readOnly,S.fwTab==="rubric");
  const gov=(!readOnly&&roMaster)?`<div class="notebox">ท่านมีสิทธิ์ตั้งค่ากรอบสมรรถนะรายชั้นปีได้เต็มรูปแบบ ทั้งการเปิดปิดสมรรถนะ ระดับเป้าหมาย ตัวชี้วัด และเกณฑ์การประเมิน
    ส่วนแท็บ "สมรรถนะหลัก" และ "ระดับสมรรถนะ" เป็นข้อมูลกลางที่ใช้ร่วมกันทุกสาขาวิชาและทุกชั้นปี จึงสงวนสิทธิ์การแก้ไขไว้ที่ประธานหลักสูตรและผู้ดูแลระบบ</div>`:"";
  return `<div class="stack">${yearStrip(y,"setyear")}${gov}
    ${S.msg?`<div class="notebox">${esc(S.msg)}</div>`:""}
    <div class="tabs">${tabs}</div>${body}</div>`;
}
function fwYearTab(y,ro){
  const yc=yearOf(FW,y);

/* ---------- 16. รายงานวินิจฉัยรายบุคคล ---------- */
function diagnosticPage(){
  const stu=filteredStudents();
  if(!stu.length) return card("รายงานวินิจฉัย","",`<div class="empty">ยังไม่มีนักศึกษาในระบบ</div>`);
  if(S.role==="Student"){ const me=userById(S.user.linkTo||S.user.id); S.dxSid=me?me.id:stu[0].id; }
  if(!S.dxSid||!userById(S.dxSid)) S.dxSid=stu[0].id;
  const st=userById(S.dxSid);
  const A=analyze(FW,S.dxSid,{cdm:S.dxCdm});
  if(!A) return card("รายงานวินิจฉัย","",`<div class="empty">ไม่พบข้อมูล</div>`);
  const lb=A.edm.risk>=.6?"เสี่ยงสูง":A.edm.risk>=.35?"ต้องเฝ้าระวัง":"ความเสี่ยงต่ำ";
  const sel=S.role==="Student"?"":`<div class="field" style="margin-top:0"><label>นักศึกษา</label>
    <select class="inp" data-act="dxsid">${stu.map(s=>`<option value="${s.id}" ${s.id===S.dxSid?"selected":""}>${s.program} ปี ${s.year} · ${esc(s.code)} · ${esc(s.name)}</option>`).join("")}</select></div>`;
  const tabs=[["irt","IRT รวม"],["mirt","MIRT รายมิติ"],["gdina","G-DINA วินิจฉัย"],["edm","EDM ทำนายผล"],["deep","DeepCDM"]]
    .map(([k,l])=>`<button class="${S.dxTab===k?"on":""}" data-act="dxtab" data-v="${k}">${l}</button>`).join("");
  let body="";
  if(S.dxTab==="irt") body=irtPanel(A);
  else if(S.dxTab==="mirt") body=mirtPanel(A);
  else if(S.dxTab==="gdina") body=gdinaPanel(A);
  else if(S.dxTab==="edm") body=edmPanel(A,st,lb);
  else body=deepPanel(A.year);
  return `<div class="stack">${filterBar()}
    ${card("รายงานวินิจฉัยรายบุคคล",`${esc(st.name)} · ${st.program} ${esc(progName(st.program))} · ${yearOf(FW,A.year).label}`,
      `<div class="grid g4" style="gap:.7rem;align-items:end">${sel}
        ${stat("ตัวชี้วัดที่มีข้อมูล",A.nItems,`${A.comps.length} สมรรถนะที่เปิดใช้`)}
        ${stat("ค่าสมรรถนะรวม θ",A.irt?fmt(A.irt.theta):"—",A.irt?`SE ${fmt(A.irt.se)}`:"")}
        ${stat("ความเสี่ยงไม่ผ่านเกณฑ์",Math.round(A.edm.risk*100)+"%",lb)}</div>`,
      `<button class="btn btn-ghost btn-sm" data-act="noop">ส่งออกเป็น PDF</button>`)}
    <div class="tabs">${tabs}</div>${body}</div>`;
}
function irtPanel(A){
  if(!A.irt) return card("IRT","",`<div class="empty">ยังไม่มีข้อมูลการประเมินสำหรับผู้เรียนรายนี้</div>`);
  const t=A.irt.theta,se=A.irt.se;
  return `<div class="grid g2" style="align-items:start">

    ${card("สรุปค่าประมาณ","",`<table><tbody>

      <tr><td style="color:var(--muted)">ช่วงเชื่อมั่น 95%</td><td class="num">${fmt(t-1.96*se)} ถึง ${fmt(t+1.96*se)}</td></tr>

      ${stat("ความน่าจะเป็นของรูปแบบที่พบ",(A.gdina.pProfile*100).toFixed(2)+"%")}
      ${stat("รูปแบบที่พิจารณาทั้งหมด",A.gdina.N.toLocaleString(),"2 ยกกำลังจำนวนคุณลักษณะ")}
      ${stat("สัดส่วนต่ำกว่าเป้าหมาย",Math.round(A.belowTarget*100)+"%","ใช้เป็นตัวแปรในโมเดลทำนาย")}</div>
    ${card("ความน่าจะเป็นของการรอบรู้รายคุณลักษณะ","",`<table class="tight"><thead><tr><th>คุณลักษณะ</th><th>ความน่าจะเป็น</th><th class="num">ค่า</th><th>ผลวินิจฉัย</th></tr></thead><tbody>${rows}</tbody></table>`,"",false)}
    ${card("ลำดับความสำคัญในการพัฒนา","สามคุณลักษณะที่มีความน่าจะเป็นต่ำสุด",weak||`<div class="empty">รอบรู้ครบทุกคุณลักษณะตามเกณฑ์ที่กำหนด</div>`)}
  </div>`;
}

/* ---------- 16ข. รายงานความก้าวหน้ารายบุคคล ---------- */
function scoreFromResp(resp,comp,y){
  const v=indsOf(FW,y,comp.id).map(i=>resp[i.id]).filter(x=>x!==undefined);
  return v.length?mean(v):null;
}
function progressPage(){
  const stu=filteredStudents();
  if(!stu.length) return card("ความก้าวหน้ารายบุคคล","",`<div class="empty">ยังไม่มีนักศึกษาในระบบ</div>`);
  if(S.role==="Student"){ const me=userById(S.user.linkTo||S.user.id); S.prgSid=me?me.id:stu[0].id; }
  if(!S.prgSid||!userById(S.prgSid)) S.prgSid=stu[0].id;
  const st=userById(S.prgSid), y=st.year, comps=activeComps(FW,y);
  const rounds=HIST[st.id]||[];
  const sel=S.role==="Student"?"":`<div class="field" style="margin-top:0"><label>นักศึกษา</label>
    <select class="inp" data-act="prgsid">${stu.map(x=>`<option value="${x.id}" ${x.id===S.prgSid?"selected":""}>${x.program} ปี ${x.year} · ${esc(x.code)} · ${esc(x.name)}</option>`).join("")}</select></div>`;

  if(!rounds.length) return `<div class="stack">${card("ความก้าวหน้ารายบุคคล",esc(st.name),
    `${sel}<div class="empty">ยังไม่มีผลการประเมินของผู้เรียนรายนี้ รายงานจะแสดงเมื่อมีการบันทึกผลอย่างน้อยหนึ่งรอบ</div>`)}</div>`;

  /* คะแนนเฉลี่ยรวมและระดับในแต่ละรอบ */
  const series=rounds.map(r=>{
    const v=comps.map(c=>compScoreAvg(FW,st.id,c,y,r).v).filter(x=>x!==null);
    return v.length?mean(v):0;
  });
  const cur=series[series.length-1], first=series[0];
  const curLv=clamp(Math.round(cur),1,FW.levels.length);
  const gain=cur-first;
  const targetAvg=mean(comps.map(c=>cfgOf(FW,y,c.id).target));

  /* การกระจายจำนวนสมรรถนะตามระดับ ในแต่ละรอบ */
  const dist=rounds.map(r=>{
    const cnt=new Array(FW.levels.length).fill(0);
    comps.forEach(c=>{ const v=compScoreAvg(FW,st.id,c,y,r).v; if(v!==null) cnt[clamp(Math.round(v),1,FW.levels.length)-1]++; });
    return cnt;
  });
  const distRows=rounds.map((r,i)=>`<tr><td style="width:120px">${r.label}<div class="sub">${r.when}</div></td>
    <td>${stackBar(dist[i],comps.length)}</td>
    <td class="num" style="width:96px">${fmt(series[i])}</td>
    <td style="width:150px">${levelChip(series[i])}</td></tr>`).join("");

  /* ตารางรายสมรรถนะ */
  const rows=comps.map((c,k)=>{
    const vals=rounds.map(r=>compScoreAvg(FW,st.id,c,y,r).v);
    const last=vals[vals.length-1], f=vals[0], t=cfgOf(FW,y,c.id).target;
    const d=(last===null||f===null)?null:last-f;
    const arrow=d===null?"—":(d>0.05?"▲":d<-0.05?"▼":"▬");
    const col=d===null?"var(--muted)":(d>0.05?"var(--ok)":d<-0.05?"var(--risk)":"var(--muted)");
    return `<tr><td class="sub">${k+1}</td>
      <td style="font-size:.82rem">${esc(c.th)}<div class="sub">${c.code}</div></td>
      ${vals.map(v=>`<td class="num">${fmt(v,1)}</td>`).join("")}
      <td class="num delta" style="color:${col}">${arrow} ${d===null?"":(d>0?"+":"")+d.toFixed(1)}</td>
      <td>${levelChip(last)}</td><td class="num">${t}</td>
      <td>${last===null?`<span class="tag tag-n">ไม่มีข้อมูล</span>`:
        `<span class="tag ${last>=t?"tag-ok":last>=t-.5?"tag-warn":"tag-risk"}">${last>=t?"ถึงเป้าหมาย":last>=t-.5?"ใกล้เป้าหมาย":"ต้องพัฒนา"}</span>`}</td></tr>`;
  }).join("");

  /* สิ่งที่ต้องทำเพื่อขึ้นระดับถัดไป */
  const nextLv=Math.min(curLv+1,FW.levels.length);
  const behind=comps.map(c=>({c,v:compScoreAvg(FW,st.id,c,y,rounds[rounds.length-1]).v,t:cfgOf(FW,y,c.id).target}))
    .filter(x=>x.v!==null&&x.v<x.t).sort((a,b)=>(a.v-a.t)-(b.v-b.t)).slice(0,5);
  const nextDesc=(cid)=>{
    const inds=indsOf(FW,y,cid); if(!inds.length) return "";
    const d=inds[0].descriptors[nextLv-1]; return d?esc(d):"";
  };
  const todo=behind.length?behind.map(x=>`<div style="border-left:3px solid var(--accent);padding-left:.8rem;margin-bottom:.7rem">
      <div style="font-weight:500;font-size:.9rem">${esc(x.c.th)}</div>
      <p style="font-size:.83rem;color:var(--text-soft);margin-top:.15rem">
        ปัจจุบัน ${fmt(x.v,1)} · เป้าหมายชั้นปี ${x.t} · ยังขาดอีก ${fmt(x.t-x.v,1)} ระดับ</p>
      <p style="font-size:.82rem;color:var(--muted);margin-top:.15rem">เกณฑ์ระดับถัดไป: ${nextDesc(x.c.id)}</p></div>`).join("")
    : `<div class="empty" style="padding:1.2rem">ทุกสมรรถนะถึงระดับเป้าหมายของชั้นปีแล้ว</div>`;

  const trend = gain>0.15?"ก้าวหน้าขึ้น":gain<-0.15?"ลดลง":"คงที่";
  const trendTag = gain>0.15?"tag-ok":gain<-0.15?"tag-risk":"tag-warn";

  return `<div class="stack">${filterBar()}
    ${card("รายงานความก้าวหน้ารายบุคคล",
      `${esc(st.name)} · ${st.program} ${esc(progName(st.program))} · ${yearOf(FW,y).label} · ภาคการศึกษา 1/2569`,
      `<div class="grid g4" style="gap:.7rem;align-items:end">${sel}
        ${stat("ระดับปัจจุบัน","ระดับที่ "+curLv,FW.levels[curLv-1].th+" · "+FW.levels[curLv-1].en)}
        ${stat("คะแนนเฉลี่ยล่าสุด",fmt(cur),`เป้าหมายเฉลี่ยของชั้นปี ${fmt(targetAvg,1)}`)}
        ${stat("การเปลี่ยนแปลงจากรอบแรก",(gain>=0?"+":"")+fmt(gain),`<span class="tag ${trendTag}">${trend}</span>`)}</div>`,
      `<button class="btn btn-ghost btn-sm" data-act="noop">ส่งออกเป็น PDF</button>`)}

    ${card("ตำแหน่งบนเส้นทางพัฒนาสมรรถนะ","ระดับคำนวณจากคะแนนเฉลี่ยของสมรรถนะที่เปิดใช้ในชั้นปีนี้",
      ladderStrip(curLv)+`<p class="hint" style="margin-top:.8rem">
        ระดับที่แสดงเป็นภาพรวม ผู้เรียนอาจอยู่คนละระดับในแต่ละสมรรถนะ ดูรายละเอียดได้ในตารางด้านล่าง</p>`)}

    ${card("เปรียบเทียบสมรรถนะรายด้านด้วยแผนภาพเรดาร์",
      "แกนคือลำดับสมรรถนะทั้ง "+comps.length+" ด้าน · เส้นประสีทองคือระดับเป้าหมายของชั้นปี · ชี้ที่จุดเพื่อดูชื่อสมรรถนะ",
      radarMultiSVG(
        comps.map((c,k)=>String(k+1)),
        [{name:rounds[0].label+" (ต้นภาค)",color:"var(--c6)",values:comps.map(c=>compScoreAvg(FW,st.id,c,y,rounds[0]).v)},
         {name:rounds[rounds.length-1].label+" (ล่าสุด)",color:"var(--c1)",values:comps.map(c=>compScoreAvg(FW,st.id,c,y,rounds[rounds.length-1]).v)},
         {name:"ระดับเป้าหมาย",color:"var(--accent)",values:comps.map(c=>cfgOf(FW,y,c.id).target),fill:false,dots:false,dash:"5 4",w:2}],
        FW.levels.length, comps.map(c=>c.th)))}

    ${card("คะแนนรายสมรรถนะเปรียบเทียบทุกรอบ",
      "แท่งเรียงจากรอบแรกไปรอบล่าสุด · ขีดสีทองคือระดับเป้าหมาย · ตัวเลขท้ายแท่งคือคะแนนรอบล่าสุด",
      groupBarSVG(
        comps.map((c,k)=>(k+1)+". "+(c.th.length>26?c.th.slice(0,25)+"…":c.th)),
        rounds.map((r,ri)=>({name:r.label,
          color:ri===rounds.length-1?"var(--c1)":(ri===0?"var(--c6)":"var(--c5)"),
          values:comps.map(c=>compScoreAvg(FW,st.id,c,y,r).v)})),
        FW.levels.length, comps.map(c=>cfgOf(FW,y,c.id).target), comps.map(c=>c.th)))}

    <div class="grid g2" style="align-items:start">
      ${card("แนวโน้มคะแนนเฉลี่ยรวม",`เปรียบเทียบ ${rounds.length} รอบการประเมินในภาคการศึกษานี้`,

function myUser(){ return userById(S.user.linkTo||S.user.id)||S.user; }

/** ระเบียนการประเมินของนักศึกษาหนึ่งคน สังเคราะห์จากผลที่บันทึกไว้แต่ละรอบ */
const ROUND_DATES=["2026-06-19","2026-07-24","2026-08-28"];
const ASSESSOR_KINDS=[["self","ประเมินตนเอง"],["lecturer","ประเมินโดยอาจารย์นิเทศก์"],["mentor","ประเมินโดยครูพี่เลี้ยง"]];
function assessRecords(sid){
  const st=userById(sid); if(!st||!HIST[sid]) return [];
  const y=st.year, comps=activeComps(FW,y);
  const lect=USERS.find(u=>u.roles.includes("Lecturer")&&u.program===st.program);
  const ment=USERS.find(u=>u.roles.includes("Mentor")&&u.program===st.program);
  const out=[];
  HIST[sid].forEach((r,ri)=>comps.forEach((c,ci)=>{
    const v=compScoreAvg(FW,st.id,c,y,r).v; if(v===null) return;
    const kind=ASSESSOR_KINDS[(ci+ri)%3];
    out.push({sid,student:st.name,round:ri,roundLabel:r.label,when:r.when,date:ROUND_DATES[ri]||"",
      comp:c,v,kind:kind[0],type:kind[1],target:cfgOf(FW,y,c.id).target,
      by:kind[0]==="self"?st.name:(kind[0]==="lecturer"?(lect?lect.name:"อาจารย์นิเทศก์"):(ment?ment.name:"ครูพี่เลี้ยง"))});
  }));
  return out;
}

/* ---------- ประวัติการประเมิน ---------- */
function pfHistory(u){
  const isStu=u.roles.includes("Student");
  if(isStu){
    const recs=assessRecords(u.id);
    if(!recs.length) return card("ประวัติการประเมิน","",`<div class="empty">ยังไม่มีผลการประเมินที่บันทึกไว้</div>`);
    const y=u.year, comps=activeComps(FW,y);
    const rounds=HIST[u.id]||[];
    const sum=rounds.map((r,ri)=>{
      const v=comps.map(c=>compScoreAvg(FW,u.id,c,y,r).v).filter(x=>x!==null);
      const av=v.length?mean(v):null;
      const onT=comps.filter(c=>{const x=compScoreAvg(FW,u.id,c,y,r).v;return x!==null&&x>=cfgOf(FW,y,c.id).target;}).length;
      return `<tr><td>${r.label}<div class="sub">${r.when} · ${ROUND_DATES[ri]||""}</div></td>
        <td class="num">${fmt(av)}</td><td>${levelChip(av)}</td>
        <td class="num">${onT} / ${comps.length}</td>
        <td class="num">${recs.filter(x=>x.round===ri).length} รายการ</td></tr>`;}).join("");
    const flt=S.histRound;
    const list=recs.filter(x=>flt==="all"||String(x.round)===flt)
      .map(x=>`<tr><td style="font-size:.8rem">${esc(x.comp.th)}<div class="sub">${x.comp.code}</div></td>
        <td style="font-size:.8rem">${esc(x.type)}<div class="sub">${esc(x.by)}</div></td>
        <td style="font-size:.8rem">${esc(x.roundLabel)}<div class="sub">${x.date}</div></td>
        <td class="num">${fmt(x.v,1)}</td><td class="num">${x.target}</td>
        <td><span class="tag ${x.v>=x.target?"tag-ok":x.v>=x.target-.5?"tag-warn":"tag-risk"}">${x.v>=x.target?"ถึงเป้าหมาย":x.v>=x.target-.5?"ใกล้เป้าหมาย":"ต้องพัฒนา"}</span></td></tr>`).join("");
    const pills=[["all","ทุกรอบ"]].concat(rounds.map((r,i)=>[String(i),r.label]))
      .map(([k,l])=>`<button class="${flt===k?"on":""}" data-act="histround" data-v="${k}">${l}</button>`).join("");
    return `<div class="stack">${pfPhoto(u)}
      ${card("สรุปรายรอบการประเมิน","จำนวนสมรรถนะที่ถึงระดับเป้าหมายของชั้นปีในแต่ละรอบ",
        `<table class="tight"><thead><tr><th>รอบ</th><th class="num">เฉลี่ย</th><th>ระดับ</th><th class="num">ถึงเป้าหมาย</th><th class="num">ระเบียน</th></tr></thead><tbody>${sum}</tbody></table>`,"",false)}
      ${card("ระเบียนการประเมินรายรายการ",`ทั้งหมด ${recs.length} รายการ`,
        `<div class="card-b" style="border-bottom:1px solid var(--line-soft)"><div class="pills">${pills}</div></div>
         <div class="scroll-y"><table class="tight"><thead><tr><th>สมรรถนะ</th><th>ประเภท / ผู้ประเมิน</th><th>รอบ</th><th class="num">ระดับ</th><th class="num">เป้าหมาย</th><th>ผล</th></tr></thead><tbody>${list}</tbody></table></div>`,
        `<button class="btn btn-ghost btn-sm" data-act="noop">ส่งออกเป็น Excel</button>`,false)}
      <div class="notebox">ระเบียนนี้สังเคราะห์จากข้อมูลจำลองเพื่อสาธิตโครงสร้าง ระบบจริงต้องบันทึกผู้ประเมิน วันเวลา และเวอร์ชันเกณฑ์ของทุกรายการ
        เพื่อให้ตรวจสอบย้อนหลังและอุทธรณ์ผลได้</div></div>`;
  }
  /* อาจารย์และครูพี่เลี้ยง: ประวัติที่ตนเองเป็นผู้ประเมิน */
  const kind=u.roles.includes("Mentor")?"mentor":"lecturer";
  const kindTh=kind==="mentor"?"ประเมินโดยครูพี่เลี้ยง":"ประเมินโดยอาจารย์นิเทศก์";
  const all=visStudents().flatMap(s=>assessRecords(s.id)).filter(x=>x.kind===kind);
  if(!all.length) return card("ประวัติการประเมินที่ท่านบันทึก","",`<div class="empty">ยังไม่มีระเบียนการประเมินในขอบเขตของท่าน</div>`);
  const byStu={};
  all.forEach(x=>{ (byStu[x.sid]=byStu[x.sid]||[]).push(x); });
  const sumRows=Object.entries(byStu).map(([sid,rs])=>{
    const st=userById(sid);
    return `<tr><td>${esc(st.name)}<div class="sub">${esc(st.code)} · ${st.program} · ปี ${st.year}</div></td>
      <td class="num">${rs.length}</td><td class="num">${fmt(mean(rs.map(r=>r.v)),2)}</td>
      <td class="num">${rs.filter(r=>r.v>=r.target).length} / ${rs.length}</td>
      <td class="num">${rs.map(r=>r.date).sort().slice(-1)[0]}</td></tr>`;}).join("");
  const recent=all.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,40)
    .map(x=>`<tr><td style="font-size:.8rem">${esc(x.student)}</td>
      <td style="font-size:.8rem">${esc(x.comp.th)}<div class="sub">${x.comp.code}</div></td>
      <td style="font-size:.8rem">${esc(x.roundLabel)}<div class="sub">${x.date}</div></td>
      <td class="num">${fmt(x.v,1)}</td><td class="num">${x.target}</td></tr>`).join("");
  return `<div class="stack">
    <div class="grid g4">${stat("ระเบียนที่บันทึก",all.length,kindTh)}
      ${stat("นักศึกษาที่ประเมิน",Object.keys(byStu).length,scopeProgram()?progName(scopeProgram()):"ทุกสาขา")}
      ${stat("ระดับเฉลี่ยที่ให้",fmt(mean(all.map(r=>r.v))))}
      ${stat("ถึงเป้าหมาย",Math.round(all.filter(r=>r.v>=r.target).length/all.length*100)+"%","ของระเบียนทั้งหมด")}</div>
    ${card("สรุปรายนักศึกษา","",
      `<div class="scroll-y"><table class="tight"><thead><tr><th>นักศึกษา</th><th class="num">ระเบียน</th><th class="num">ระดับเฉลี่ย</th><th class="num">ถึงเป้าหมาย</th><th class="num">ประเมินล่าสุด</th></tr></thead><tbody>${sumRows}</tbody></table></div>`,"",false)}
    ${card("ระเบียนล่าสุด","แสดง 40 รายการล่าสุด",
      `<div class="scroll-y"><table class="tight"><thead><tr><th>นักศึกษา</th><th>สมรรถนะ</th><th>รอบ</th><th class="num">ระดับ</th><th class="num">เป้าหมาย</th></tr></thead><tbody>${recent}</tbody></table></div>`,"",false)}
    <div class="notebox">ระบบจริงควรแสดงความสอดคล้องระหว่างผู้ประเมิน (inter-rater reliability) ในหน้านี้ด้วย
      เพื่อให้ผู้ประเมินเห็นว่าตนเองให้คะแนนสูงหรือต่ำกว่าค่ากลางของคณะอย่างเป็นระบบหรือไม่</div></div>`;
}

        <b>ผลการประเมินตนเองมีน้ำหนักในการตัดสินผลหรือไม่</b>
        <p style="color:var(--text-soft);margin:.15rem 0 .7rem">ใช้เพื่อการเรียนรู้และเทียบมุมมองกับผู้ประเมินอื่น การกำหนดน้ำหนักในการตัดสินผลเป็นอำนาจของหลักสูตร</p>
        <b>แก้ผลที่บันทึกไปแล้วได้หรือไม่</b>
        <p style="color:var(--text-soft);margin:.15rem 0 .7rem">ระบบจริงควรอนุญาตให้แก้ภายในกรอบเวลาที่หลักสูตรกำหนด และบันทึกประวัติการแก้ไขไว้ทุกครั้ง</p>
        <b>ทำไมผลของฉันเทียบกับเพื่อนต่างชั้นปีไม่ได้</b>
        <p style="color:var(--text-soft);margin:.15rem 0 0">เพราะตัวชี้วัดและระดับเป้าหมายของแต่ละชั้นปีเป็นคนละชุด การเทียบข้ามชั้นปีต้องเชื่อมมาตรวัดก่อน</p></div>`)}
  </div>`;
}

function assessPage(){
  const stu=visStudents();
  if(!stu.length) return card("การประเมิน","",`<div class="empty">ยังไม่มีนักศึกษาในระบบ</div>`);
  if(S.role==="Student"){const me=userById(S.user.linkTo||S.user.id); S.asSid=me?me.id:stu[0].id;}
  if(!S.asSid||!userById(S.asSid)) S.asSid=stu[0].id;
  const st=userById(S.asSid), y=st.year, comps=activeComps(FW,y);
  if(!comps.length) return card("การประเมิน","",`<div class="empty">ชั้นปีนี้ยังไม่มีสมรรถนะที่เปิดใช้</div>`);
  if(!S.asComp||!comps.some(c=>c.id===S.asComp)) S.asComp=comps[0].id;
  const c=comps.find(x=>x.id===S.asComp), cfg=cfgOf(FW,y,c.id);
  const done=cfg.indicators.length>0&&cfg.indicators.every(i=>S.asScores[i.id]);
  const result=done?mean(cfg.indicators.map(i=>S.asScores[i.id])):null;

    .map(([id,l])=>`<option value="${id}" ${S.asType===id?"selected":""}>${l}</option>`).join("");
  const indCards=cfg.indicators.length?cfg.indicators.map((i,n)=>card(esc(i.th),`ตัวชี้วัดที่ ${n+1} จาก ${cfg.indicators.length}`,
    `<div class="scale-grid" style="grid-template-columns:repeat(${FW.levels.length},1fr)">

    <div class="stack">
      ${card("แบบประเมินสมรรถนะ",`${yearOf(FW,y).label} · ระยะ${yearOf(FW,y).stage} · เป้าหมายระดับ ${cfg.target}`,
        `<div class="grid g3" style="gap:.7rem">
          ${S.role==="Student"?"":`<div class="field" style="margin-top:0"><label>นักศึกษา</label>
            <select class="inp" data-act="assid">${stu.map(s=>`<option value="${s.id}" ${s.id===S.asSid?"selected":""}>${s.program} ปี ${s.year} · ${esc(s.name)}</option>`).join("")}</select></div>`}
          <div class="field" style="margin-top:0"><label>สมรรถนะ</label>
            <select class="inp" data-act="ascomp">${comps.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${x.code} · ${esc(x.th)}</option>`).join("")}</select></div>
          <div class="field" style="margin-top:0"><label>ประเภทการประเมิน</label><select class="inp" data-act="astype">${typeOpts}</select></div>
        </div>`)}
      ${indCards}
      ${card("ข้อเสนอแนะเพื่อการพัฒนา","",
        `<textarea class="inp" rows="4" placeholder="ระบุสิ่งที่ทำได้ดีและสิ่งที่ควรพัฒนา พร้อมข้อเสนอแนะที่นำไปปฏิบัติได้" data-nore></textarea>
         ${S.asSaved?`<div class="alert alert-ok">บันทึกผลการประเมินแล้ว</div>`:""}
         <button class="btn btn-primary" ${done?"":"disabled style=opacity:.45"} data-act="assave">${done?"บันทึกผลการประเมิน":"เลือกระดับให้ครบทุกตัวชี้วัด"}</button>`)}
    </div>
    <div class="stack">
      ${card("สรุปผล","",result===null?`<div class="empty" style="padding:1.4rem 0">ผลจะแสดงเมื่อประเมินครบทุกตัวชี้วัด</div>`:

           ${result>=cfg.target?`ถึงระดับเป้าหมายของชั้นปี (${cfg.target})`:`ยังต่ำกว่าระดับเป้าหมายของชั้นปี (${cfg.target})`}</p>`)}
