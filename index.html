    case "setirt": S.irtModel=v; IQ_CACHE={}; break;
    case "irtcmp": S.irtCmp=!S.irtCmp; break;
    case "clearf": S.fy="all"; S.fp="all"; S.repView=null; S.repMsg=""; EDM_CACHE=null; S.dxSid=null; S.prgSid=null; break;
    case "repmake": { const R=buildReport(v);
      if(!R.rows.length){ S.repView=null; S.repErr=true;
        S.repMsg="ไม่พบข้อมูลตามขอบเขตที่เลือก กรุณาปรับตัวกรองชั้นปีหรือสาขาวิชา"; break; }
      S.repView=R; S.repErr=false;
      S.repMsg="สร้าง"+R.name+"เรียบร้อย "+R.rows.length+" แถว ขอบเขต "+R.scope; break; }
    case "repclose": S.repView=null; S.repMsg=""; break;
    case "repcsv": { const R=buildReport(v);
      if(!R.rows.length){ S.repErr=true; S.repMsg="ไม่พบข้อมูลตามขอบเขตที่เลือก"; break; }
      const ok=downloadFile(R.id+"_"+(S.fy==="all"?"all":"y"+S.fy)+"_"+(S.fp==="all"?"all":S.fp)+".csv",
        toCSV([[R.name],[ "ขอบเขต",R.scope]].concat([[]]).concat([R.head]).concat(R.rows)),"text/csv");
      S.repErr=!ok;
      S.repMsg=ok?("ดาวน์โหลดไฟล์ CSV แล้ว "+R.rows.length+" แถว")
        :"เบราว์เซอร์ปิดกั้นการดาวน์โหลด กรุณากดสร้างรายงานเพื่อดูบนหน้าจอ แล้วใช้ปุ่มพิมพ์แทน"; break; }
    case "rephtml": { const R=buildReport(v);
      if(!R.rows.length){ S.repErr=true; S.repMsg="ไม่พบข้อมูลตามขอบเขตที่เลือก"; break; }
      const ok=downloadFile(R.id+"_"+(S.fy==="all"?"all":"y"+S.fy)+"_"+(S.fp==="all"?"all":S.fp)+".html",
        reportHTML(R),"text/html");
      S.repErr=!ok;
      S.repMsg=ok?"ดาวน์โหลดไฟล์ HTML แล้ว เปิดด้วยเบราว์เซอร์หรือ Word ได้"
        :"เบราว์เซอร์ปิดกั้นการดาวน์โหลด กรุณาใช้ปุ่มพิมพ์แทน"; break; }
    case "repprint": { const R=S.repView||buildReport(v);
      const w=window.open("","_blank");
      if(w){ w.document.write(reportHTML(R)); w.document.close(); setTimeout(()=>w.print(),400); S.repErr=false;
        S.repMsg="เปิดหน้าต่างสำหรับพิมพ์แล้ว เลือกปลายทางเป็น Save as PDF เพื่อบันทึกเป็นไฟล์"; }
      else { S.repErr=true; S.repMsg="เบราว์เซอร์ปิดกั้นการเปิดหน้าต่างใหม่ กรุณาอนุญาต pop-up แล้วลองอีกครั้ง"; }
      break; }
    case "itemadd": { addItem(v); S.iqMsg="เพิ่มข้อสอบใหม่แล้ว กรุณาแก้ไขโจทย์ ตัวเลือก และกำหนดเฉลยให้ถูกต้อง"; break; }
    case "itemdup": { const it=findItem(v); if(it){ addItem(it.comp,it);
      S.iqMsg="ทำสำเนาข้อ "+v+" แล้ว"; } break; }
    case "itemdel": { const it=findItem(v); if(!it) break;
      if(bankOf(it.comp).length<=1){ S.iqMsg="ต้องมีข้อสอบอย่างน้อยหนึ่งข้อในแต่ละสมรรถนะ"; break; }
      if(!confirm("ยืนยันการลบข้อ "+v+"?\n\nระบบจะล้างผลวิเคราะห์คุณภาพข้อสอบและผลการฝึกโมเดลเดิม แล้วคำนวณใหม่เมื่อเปิดดูครั้งถัดไป")) break;
      BANK=BANK.filter(x=>x.id!==v); bankChanged();
      S.iqMsg="ลบข้อ "+v+" แล้ว"; break; }
    case "itemkey": { const it=findItem(v); if(it){ it.key=+k; it.custom=true;
      S.iqMsg="กำหนดให้ตัวเลือก "+CHOICE_LB[+k]+" เป็นเฉลยของข้อ "+v; } break; }
    case "itemreset": { BANK=BANK.filter(x=>x.comp!==v).concat(buildBank().filter(x=>x.comp===v));
      BANK.sort((x,y)=>x.comp.localeCompare(y.comp)||x.no-y.no);
      bankChanged(); S.iqMsg="คืนค่าคลังข้อสอบของสมรรถนะนี้กลับเป็นชุดตั้งต้นแล้ว"; break; }
    case "gotoiq": S.page="itemq"; S.iqComp=v; S.iqTab="ctt"; S.iqItem=0; break;
    case "fwtest": { const cf=cfgOf(FW,S.year,v); cf.test=cf.test||{n:30,min:45}; cf.test.open=el.checked; break; }
    case "examstart": S.examComp=v; S.examAns={}; S.examDone=false; break;
    case "examexit": S.examComp=null; S.examAns={}; S.examDone=false; break;
    case "examans": S.examAns[v]=+k; break;
    case "examsubmit": examSubmit(); S.examDone=true; break;
    case "edmcompare": S.edmCompare=true; break;
    case "edmback": S.edmCompare=false; break;
    case "edmreset": EDM_CACHE=null; S.msg=""; break;
    case "gotoprofile": S.page="profile"; S.pfTab=v; S.pfMsg=""; S.pfErr=""; break;
    case "histround": S.histRound=v; break;
    case "pfsave": {
      const u=myUser(); const g=id=>{const e=document.getElementById(id);return e?String(e.value).trim():undefined;};
      const nm=g("pf_name"), em=g("pf_em"), tel=g("pf_tel");
      if(!nm){S.pfErr="กรุณากรอกชื่อ-นามสกุล";break;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em||"")){S.pfErr="รูปแบบอีเมลไม่ถูกต้อง";break;}
      if(USERS.some(x=>x.id!==u.id&&!x.linkTo&&x.email.toLowerCase()===em.toLowerCase())){S.pfErr="อีเมลนี้ถูกใช้กับบัญชีอื่นแล้ว";break;}
      if(tel&&!/^0\d{8,9}$/.test(tel.replace(/[-\s]/g,""))){S.pfErr="หมายเลขโทรศัพท์ไม่ถูกต้อง";break;}
      u.name=nm; u.email=em; u.tel=tel||"";
      const pos=g("pf_pos"); if(pos!==undefined) u.acadPos=pos;
      const s1=g("pf_sch"); if(s1!==undefined) u.school=s1;
      const s2=g("pf_sch2"); if(s2!==undefined) u.school=s2;
      const af=g("pf_aff"); if(af!==undefined) u.aff=af;
      const gr=g("pf_grp"); if(gr!==undefined) u.group=gr;
      const lv=g("pf_lvl"); if(lv!==undefined) u.teachLevel=lv;
      const ex=g("pf_exp"); if(ex!==undefined) u.exp=ex;
      if(S.user.linkTo||S.user.id===u.id) S.user=u;
      S.pfErr=""; S.pfMsg="บันทึกข้อมูลส่วนตัวแล้ว"; break; }
    case "pfpw": {
      const g=id=>{const e=document.getElementById(id);return e?String(e.value):"";};
      const o=g("sec_old"), p1=g("sec_p1"), p2=g("sec_p2");
      const uu=myUser(); const curPw=uu.pw||PASSWORD;
      if(o!==curPw){S.pfErr="รหัสผ่านปัจจุบันไม่ถูกต้อง";break;}
      if(p1.length<12){S.pfErr="รหัสผ่านใหม่ต้องยาวอย่างน้อย 12 อักขระ";break;}
      if(pwStrength(p1)<3){S.pfErr="รหัสผ่านใหม่ยังไม่แข็งแรงพอ ควรผสมตัวพิมพ์ใหญ่ พิมพ์เล็ก ตัวเลข และสัญลักษณ์";break;}
      if(p1===o){S.pfErr="รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม";break;}
      if(p1!==p2){S.pfErr="รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน";break;}
      uu.pw=p1; uu.pwChanged="3 ก.ย. 2569";
      S.pfErr=""; S.pfMsg="เปลี่ยนรหัสผ่านเรียบร้อยแล้ว ครั้งต่อไปให้เข้าสู่ระบบด้วยรหัสผ่านใหม่ (มีผลจนกว่าจะรีเฟรชหน้า เพราะต้นแบบยังไม่มีฐานข้อมูล)"; break; }
    case "runcdm": S.dxCdm=true; break;

    /* --- การประเมิน --- */
    case "asscore": S.asScores[v]=+k; S.asSaved=false; break;
    case "assave": S.asSaved=true; break;

    /* --- แฟ้มสะสมงาน --- */
    case "evcomp": { const i=S.evNew.comps.indexOf(v);
      if(i<0) S.evNew.comps.push(v); else S.evNew.comps.splice(i,1); break; }
    case "evadd": { const t=val("ev_title");
      if(!t||!S.evNew.comps.length) break;
      EVIDENCE.unshift({id:nid("e"),title:t,type:S.evNew.type,date:"2026-09-03",comps:[...S.evNew.comps],status:"pending"});
      S.evNew={title:"",type:S.evNew.type,comps:[]}; break; }

    case "noop": alert("ต้นแบบนี้ยังไม่ได้เชื่อมต่อบริการสร้างไฟล์ ฟังก์ชันนี้ต้องพัฒนาในฝั่งเซิร์ฟเวอร์"); re=false; break;
    default: re=false;
  }
  if(re) render();
});

/* select และ checkbox */
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, k=el.dataset.k, cid=el.dataset.c, val2=el.value;
  let re=true;
  switch(a){
    case "role": S.role=val2; S.page="dashboard"; break;
    case "usrf": S.usrFilter[el.dataset.k||"role"]=val2; break;
    case "dxsid": S.dxSid=val2; S.dxCdm=false; break;
    case "prgsid": S.prgSid=val2; break;
    case "edmsid": S.edmSid=val2; break;
    case "xaisid": S.xaiSid=val2; break;
    case "itemta": case "itemtb": case "itemtc": case "itemtd": {
      const it=findItem(v); if(!it) { re=false; break; }
      it.tA=clamp(+it.tA||1,0.1,4); it.tB=clamp(+it.tB||0,-4,4);
      if(it.tC===undefined) it.tC=GUESS_C; if(it.tD===undefined) it.tD=1;
      it.tC=clamp(+it.tC,0,0.5); it.tD=clamp(+it.tD,0.5,1);
      if(it.tC>=it.tD){ it.tC=Math.max(0,+(it.tD-0.05).toFixed(3));
        S.iqMsg="ข้อ "+v+": ขอบล่าง c ต้องน้อยกว่าขอบบน d ระบบปรับค่า c ให้เป็น "+it.tC+" แล้ว"; }
      else S.iqMsg="ปรับพารามิเตอร์ของข้อ "+v+" แล้ว (a="+it.tA+" b="+it.tB+" c="+it.tC+" d="+it.tD+
        ") ระบบสร้างข้อมูลจำลองและผลวิเคราะห์ใหม่ทั้งหมด";
      it.custom=true; bankChanged(); break; }
    case "avatarup": {
      const f=el.files&&el.files[0];
      readAvatar(f,(data,err)=>{
        const u=myUser();
        if(err||!u){ S.pfPhotoErr=true; S.pfPhotoMsg=err||"ไม่พบบัญชีผู้ใช้"; }
        else { u.photo=data; S.pfPhotoErr=false;
          S.pfPhotoMsg="อัปโหลดรูปประจำตัวเรียบร้อยแล้ว"; }
        render();
      });
      re=false; break; }
    case "setfy": S.fy=val2; S.repView=null; S.repMsg=""; EDM_CACHE=null; S.dxSid=null; S.prgSid=null; break;
    case "setfp": S.fp=val2; S.repView=null; S.repMsg=""; EDM_CACHE=null; S.dxSid=null; S.prgSid=null; break;
    case "irtmodel": S.irtModel=val2; IQ_CACHE={}; break;
    case "iqcomp": S.iqComp=val2; S.iqItem=0; S.iqMsg=""; break;
    case "pfaff": case "pfgrp": case "pflvl": case "pfsch": break;
    case "lecscope": S.lecScope=val2; break;
    case "assid": S.asSid=val2; S.asScores={}; S.asComp=null; S.asSaved=false; break;
    case "ascomp": S.asComp=val2; S.asScores={}; S.asSaved=false; break;
    case "astype": S.asType=val2; break;
    case "evtype": S.evNew.type=val2; re=false; break;
    case "fwtarget": cfgOf(FW,S.year,v).target=+val2; break;
    case "fwtest": { const cf=cfgOf(FW,S.year,v); cf.test=cf.test||{n:30,min:45}; cf.test.open=el.checked; break; }
    case "fwactive": cfgOf(FW,S.year,v).active=el.checked; break;
    case "fwmcsel": { const c=FW.competencies.find(x=>x.id===v); if(c) c.ptru=val2; break; }
    case "fwcopy": { if(!val2) {re=false;break;}
      const src=yearOf(FW,+val2), dst=yearOf(FW,S.year);
      dst.config=Object.fromEntries(Object.entries(src.config).map(([cid2,cf])=>[cid2,{
        active:cf.active,target:cf.target,
        indicators:cf.indicators.map(i=>({id:nid("I"),th:i.th,descriptors:[...i.descriptors],
          irt:{a:i.irt.a,b:[...i.irt.b]},cdm:{...i.cdm},q:[...i.q]}))}]));
      setMsg(`คัดลอกการตั้งค่าจากชั้นปีที่ ${val2} มายัง${dst.label}แล้ว ตัวชี้วัดถูกสร้างเป็นรายการใหม่ ไม่ผูกกับผลประเมินของชั้นปีต้นทาง`); break; }
    default: re=false;
  }
  if(re) render();
});

/* ช่องกรอกข้อความ — แก้ข้อมูลโดยไม่ render ใหม่ เพื่อไม่ให้เคอร์เซอร์หลุด */
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="pwcheck"){
    const k=pwStrength(el.value);
    const bar=document.getElementById(el.dataset.v+"_m"), tx=document.getElementById(el.dataset.v+"_t");
    const names=["สั้นเกินไป","อ่อนมาก","อ่อน","พอใช้","ดี","แข็งแรงมาก"];
    const cols=["var(--risk)","var(--risk)","var(--warn)","var(--warn)","var(--ok)","var(--ok)"];
    if(bar) bar.firstElementChild.style.cssText="height:100%;border-radius:3px;width:"+(k/5*100)+"%;background:"+cols[k];
    if(tx) tx.textContent="ความแข็งแรงของรหัสผ่าน: "+names[k];
    return;
  }
  const a=el.dataset.act, v=el.dataset.v, k=el.dataset.k, cid=el.dataset.c, val2=el.value;
  switch(a){
    case "itemstem": { const it=findItem(v); if(it){it.stem=val2;it.custom=true;} break; }
    case "itemopt": { const it=findItem(v); if(it){it.choices[+k]=val2;it.custom=true;} break; }
    case "itemta": { const it=findItem(v); if(it){it.tA=clamp(+val2||1,0.1,4);it.custom=true;} break; }
    case "itemtb": { const it=findItem(v); if(it){it.tB=clamp(+val2||0,-4,4);it.custom=true;} break; }
    case "itemtc": { const it=findItem(v); if(it){it.tC=clamp(+val2||0,0,0.5);it.custom=true;} break; }
    case "itemtd": { const it=findItem(v); if(it){it.tD=clamp(isNaN(+val2)?1:+val2,0.5,1);it.custom=true;} break; }
    case "usrq": S.usrFilter.q=val2; clearTimeout(window.__q); window.__q=setTimeout(render,300); break;
    case "evtitle": S.evNew.title=val2; break;
    case "fwylabel": yearOf(FW,S.year).label=val2; break;
    case "fwystage": yearOf(FW,S.year).stage=val2; break;
    case "fwindtext": { const i=findInd(S.fwSel,v,S.year); if(i) i.th=val2; break; }
    case "fwdesc": { const i=findInd(S.fwSel,v,S.year); if(i) i.descriptors[+k]=val2; break; }
    case "fwmc": { const c=FW.competencies.find(x=>x.id===v); if(c) c[k]=val2; break; }
    case "fwlv": { const l=FW.levels.find(x=>x.id===v); if(l) l[k]=val2; break; }
    case "psya": { const i=findInd(cid,v,S.psyYear); if(i) i.irt.a=+val2; break; }
    case "psyb": { const i=findInd(cid,v,S.psyYear); if(i) i.irt.b[+k]=+val2; break; }
    case "psyg": { const i=findInd(cid,v,S.psyYear); if(i) i.cdm.g=+val2; break; }
    case "psys": { const i=findInd(cid,v,S.psyYear); if(i) i.cdm.s=+val2; break; }
    case "fwtestn": { const cf=cfgOf(FW,S.year,v); cf.test=cf.test||{open:false,min:45}; cf.test.n=clamp(+val2||30,5,30); break; }
    case "fwtestm": { const cf=cfgOf(FW,S.year,v); cf.test=cf.test||{open:false,n:30}; cf.test.min=clamp(+val2||45,10,180); break; }
  }
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const id=e.target.id;
  if(id==="em"||id==="pw") document.querySelector('[data-act="login"]').click();
  if(id==="otp") document.querySelector('[data-act="otp"]').click();
  if(id==="ic") document.querySelector('[data-act="regcheck"]').click();
});

render();
</script>
